# ─────────────────────────────────────────────────────────────────────────────
# PropFirm Platform — Docker Compose
# Usage: docker compose up -d
# Prerequisites:
#   1. copy .env.template → .env and fill in all values
#   2. place fullchain.pem + privkey.pem in deploy/certs/
#   3. point MT5_BRIDGE_PATH at the host directory your MetaTrader 5 DWX
#      terminal writes into (see the price-feed note in DEPLOYMENT_CHECKLIST.md)
#
# The `version:` key is intentionally absent — it is obsolete under Compose v2
# and emits a deprecation warning.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: propfirm_postgres
    restart: unless-stopped
    # The image default is max_connections=100, which the backend pool (60) plus
    # the migrate job, email worker and admin sessions can crowd. 200 leaves room
    # without the memory cost of going higher.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
    environment:
      POSTGRES_DB:       ${DB_NAME:-propfirm}
      POSTGRES_USER:     ${DB_USER:-propfirm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-propfirm} -d ${DB_NAME:-propfirm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: propfirm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── PgBouncer (opt-in) ───────────────────────────────────────────────────────
  # Connection pooler in TRANSACTION mode. Lets several hundred client
  # connections share ~40 real Postgres backends, which is what makes running
  # more than one backend instance affordable.
  #
  # OPT-IN ON PURPOSE. Enable with:
  #     docker compose --profile pgbouncer up -d
  #     DB_POOLER_HOST=pgbouncer DB_POOLER_PORT=6432
  # Without those it does not start and every service connects straight to
  # Postgres, exactly as before. Changing the connection path of a live trading
  # system is not something to inherit silently from a git pull.
  #
  # Before enabling, know what transaction pooling does NOT preserve: session
  # state. Session-level advisory locks are the one thing in this codebase that
  # depends on it (utils/advisoryLock.js, guarding the scheduler jobs), which is
  # why the backend below is also given DIRECT_DATABASE_URL — that pool bypasses
  # the pooler. The pg_advisory_xact_lock calls used everywhere else are
  # transaction-scoped and safe through a pooler.
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: propfirm_pgbouncer
    restart: unless-stopped
    profiles: ["pgbouncer"]
    environment:
      PGBOUNCER_DATABASE:   ${DB_NAME:-propfirm}
      POSTGRESQL_HOST:      postgres
      POSTGRESQL_PORT:      5432
      POSTGRESQL_USERNAME:  ${DB_USER:-propfirm}
      POSTGRESQL_PASSWORD:  ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE:  transaction
      PGBOUNCER_MAX_CLIENT_CONN:   500
      PGBOUNCER_DEFAULT_POOL_SIZE: 40
      PGBOUNCER_MIN_POOL_SIZE:     10
      # node-postgres sends statement_timeout as a startup parameter (see the
      # pool config in backend/db.js). PgBouncer rejects unknown startup
      # parameters in transaction mode unless they are listed here, so without
      # this every connection attempt fails immediately.
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Migrations (one-shot) ────────────────────────────────────────────────────
  # Runs to completion, then exits. Backend waits on it via
  # `condition: service_completed_successfully`, so schema changes are applied
  # exactly once no matter how many backend replicas you run. Previously the
  # backend's own CMD ran `npm run migrate` on every container start, which
  # races itself the moment you scale past one.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propfirm_migrate
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV:     production
      # Always straight to Postgres, never through PgBouncer: DDL and the
      # migration advisory lock are session-scoped and do not survive
      # transaction pooling.
      DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-propfirm}
    entrypoint: ["dumb-init", "--"]
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propfirm_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:     production
      TRUST_PROXY:  ${TRUST_PROXY:-1}
      # Defaults to postgres:5432. Set DB_POOLER_HOST=pgbouncer and
      # DB_POOLER_PORT=6432 (with --profile pgbouncer) to route through the
      # pooler; nothing else needs to change.
      DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@${DB_POOLER_HOST:-postgres}:${DB_POOLER_PORT:-5432}/${DB_NAME:-propfirm}
      # Session-scoped advisory locks (the scheduler mutex) must bypass any
      # pooler. See the directPool comment in backend/db.js.
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-propfirm}
      # Optional read replica for analytics, transparency and the leaderboard.
      # Falls back to DATABASE_URL when unset.
      READ_DATABASE_URL: ${READ_DATABASE_URL:-}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      # Trade engine mode. `interval` (default) keeps the original polling loops
      # at their original cadence. `event` drives SL/TP, pending fills, drawdown
      # and profit targets off the price tick itself, demoting those loops to
      # safety fallbacks. Flip back to `interval` and restart to roll back.
      ENGINE_MODE:  ${ENGINE_MODE:-interval}
      # Where the MT5/DWX bridge files are mounted inside the container.
      DWX_PATH:     /app/mt5-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
      # ── MT5 price-feed bridge ────────────────────────────────────────────────
      # The price feed is FILE-BASED ONLY (priceFeed.js reads DWX_Market_Data.txt
      # etc.; price_feed_sources.source_type accepts only 'shared_env' and
      # 'dwx_path'). There is no HTTP/WebSocket market-data provider, and this
      # alpine container has no MetaTrader. A MetaTrader 5 terminal must run
      # OUTSIDE these containers — a Windows host or Wine — writing its DWX
      # files into MT5_BRIDGE_PATH on the host.
      #
      # Read-write: the backend also writes DWX_Commands_*.txt to subscribe to
      # symbols. Set MT5_BRIDGE_PATH in .env.
      - ${MT5_BRIDGE_PATH:-./deploy/mt5-bridge}:/app/mt5-bridge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - external

  # ── Frontend ─────────────────────────────────────────────────────────────────
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propfirm_email_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Short transactions only, so it is safe through the pooler when enabled.
      DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@${DB_POOLER_HOST:-postgres}:${DB_POOLER_PORT:-5432}/${DB_NAME:-propfirm}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-propfirm}
      EMAIL_WORKER_POLL_MS: ${EMAIL_WORKER_POLL_MS:-5000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-10}
    command: ["node", "workers/emailWorker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logs:/app/logs
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # MUST stay empty. services/api.js uses VITE_API_URL as the axios
        # baseURL, and every call path already starts with /api/... — so behind
        # the same-origin nginx proxy an empty baseURL resolves correctly to
        # /api/...  Setting it to a full URL produces /api/api/... and breaks
        # every request. Only override this if the API is on another origin.
        VITE_API_URL:     "${VITE_API_URL-}"
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
        VITE_SENTRY_DSN:  ${FRONTEND_SENTRY_DSN:-}
    container_name: propfirm_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - external

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: propfirm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/propfirm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - external

volumes:
  pgdata:
  redisdata:
  uploads:
  logs:
  nginx_logs:

networks:
  internal:
    driver: bridge
    internal: true   # postgres + redis not reachable from outside
  external:
    driver: bridge
