version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# PropFirm Platform — Docker Compose
# Usage: docker-compose up -d
# Prerequisites: copy .env.template → .env and fill in all values
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: propfirm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-propfirm}
      POSTGRES_USER:     ${DB_USER:-propfirm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-propfirm} -d ${DB_NAME:-propfirm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: propfirm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propfirm_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:     production
      TRUST_PROXY:  ${TRUST_PROXY:-1}
      DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-propfirm}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redispass}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - external

  # —— Trade Copier Watcher ——————————————————————————————————————————————————————————————
  copier:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propfirm_copier
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-propfirm}
      API_BASE_URL: http://backend:5000
      ADMIN_JWT: ${COPIER_ADMIN_JWT:-}
      MT5_BRIDGE_HOST: ${MT5_BRIDGE_HOST:-host.docker.internal}
      MT5_BRIDGE_PORT: ${MT5_BRIDGE_PORT:-9999}
      POLL_MS: ${COPIER_POLL_MS:-200}
      API_POLL_MS: ${COPIER_API_POLL_MS:-1000}
      WS_URL: ${COPIER_WS_URL:-}
    command: ["node", "trade-copier/watcher.js"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node scripts/copier-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Frontend ─────────────────────────────────────────────────────────────────
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propfirm_email_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-propfirm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-propfirm}
      EMAIL_WORKER_POLL_MS: ${EMAIL_WORKER_POLL_MS:-5000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-10}
    command: ["node", "workers/emailWorker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logs:/app/logs
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL:       ${FRONTEND_URL:-http://localhost}/api
        REACT_APP_FIRM_NAME:     ${PLATFORM_NAME:-PropFirm}
        REACT_APP_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#0066ff}
        REACT_APP_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@propfirm.com}
    container_name: propfirm_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - external

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: propfirm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/propfirm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - external

volumes:
  pgdata:
  redisdata:
  uploads:
  logs:
  nginx_logs:

networks:
  internal:
    driver: bridge
    internal: true   # postgres + redis not reachable from outside
  external:
    driver: bridge
