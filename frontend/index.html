<!DOCTYPE html>
<!-- data-theme is stamped here, not left to ThemeContext's effect.
     ThemeProvider defaults to "light" but the :root block in tokens.css is the
     DARK palette, so every cold load painted a full dark frame and then flipped
     to light once the effect ran. Besides the visible flash, that frame pairs
     dark-theme text with the light background mid-transition -- 3.21:1 on the
     legal pages' Back button, which is how the axe scan caught it.
     ThemeContext still overrides this once the user's saved preference loads. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
      values on notched devices; without it the app's existing safe-area padding
      (trader bottom nav, risk banner) silently computes to 0.
      No maximum-scale / user-scalable: pinch-zoom stays available.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131211" />

    <!--
      Content-Security-Policy.

      connect-src intentionally allows https: and wss: broadly: the SPA is
      white-labelled and talks to whatever origin it is served from, which is
      not known at build time. The backend sends its own stricter,
      origin-specific CSP via helmet (server.js) for API responses.

      If you deploy to a single fixed domain, tighten connect-src to
      'self' https://your-domain.com wss://your-domain.com and drop the
      wildcards.

      frame-ancestors is deliberately absent: the spec ignores it (and
      report-uri/sandbox) in a <meta> policy, and browsers log
      "The Content Security Policy directive 'frame-ancestors' is ignored
      when delivered via a <meta> element" for it. Clickjacking protection
      is delivered as a real header instead — see the
      Content-Security-Policy / X-Frame-Options add_header lines in
      deploy/nginx/propfirm.conf and the helmet config in backend/server.js.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' https://s3.tradingview.com;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com data:;
               img-src 'self' data: blob: https:;
               connect-src 'self' https: wss:;
               frame-src https://www.tradingview.com https://s.tradingview.com https://www.tradingview-widget.com;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />

    <title>Funded Trading Challenges | Trade Our Capital</title>
    <!--
      JSON-LD. Organization and FAQPage were both absent, so no rich result of
      any kind was possible. `name` and `url` deliberately carry no invented
      entity: they describe the service, and the legal entity belongs here once
      it exists (see the footer and Terms, which have the same gap).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Funded Trading Challenges",
        "description": "A proprietary trading evaluation platform. Traders pass a rules-based evaluation on simulated capital and keep 100% of the profits they make on a funded account.",
        "logo": "/logo512.png"
      }
    </script>
    <meta
      name="description"
      content="Prove your edge on a funded trading challenge and keep 100% of your profits — we take no cut. Live institutional pricing in a browser terminal, published rules, and fast payouts across forex, indices and metals."
    />
    <!--
      The canonical and the absolute social-image URLs are injected at build time
      from VITE_PUBLIC_ORIGIN — see seoPlugin() in vite.config.mjs. The domain is
      not known when this file is authored, and a relative canonical is
      meaningless, so with the variable unset this line becomes a comment and
      both tags are simply absent rather than wrong.

      useDocumentMeta() reads this same tag at runtime to build the per-route
      canonical, so the build-time origin and the in-app one cannot disagree.
    -->
    <meta name="site-origin" content="" />

    <!-- Open Graph — controls how links render on Discord, WhatsApp, LinkedIn, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Funded Trading Challenges" />
    <meta property="og:title" content="Funded Trading Challenges | Trade Our Capital" />
    <meta
      property="og:description"
      content="Prove your edge on a funded trading challenge and keep 100% of your profits — we take no cut. Live institutional pricing, published rules, and fast payouts."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/logo512.png" />
    <meta property="og:image:alt" content="Funded trading challenge platform dashboard" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Funded Trading Challenges | Trade Our Capital" />
    <meta
      name="twitter:description"
      content="Prove your edge on a funded trading challenge and keep 100% of your profits — we take no cut."
    />
    <meta name="twitter:image" content="/logo512.png" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
