name: CI

on:
  # Every branch, not just main. CI checks out a fresh tree, which is the only
  # thing that catches a commit depending on a file that was never committed —
  # local runs always pass because the file is sitting in the working tree.
  # Restricting this to main meant that class of break stayed invisible until
  # a PR was opened, which is exactly how it reached this branch once.
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — no point burning minutes on a commit
# that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + audit + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Fails on real defects (unreachable code, duplicate keys, undefined
        # identifiers). Hygiene findings are warnings and do not block —
        # `npm run lint:strict` treats them as blocking when you want that.
        run: npm run lint

      - name: Syntax check
        run: npm run check

      - name: npm audit (high/critical only)
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test


  visual:
    name: Design system (viewport matrix + visual regression)
    runs-on: ubuntu-latest
    # The whole point of this job is that it runs somewhere with FIXED font
    # rasterisation. Baselines produced on a developer's Windows or macOS
    # machine will not match a Linux runner's, and the permanent red that
    # results is the most common reason screenshot suites get deleted. The image
    # tag must stay in step with @playwright/test in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Storybook
        working-directory: frontend
        # Stories render fixed content and hit no backend, so the same input
        # produces the same pixels -- which is what makes a screenshot diff
        # mean something. Screenshotting the app instead would report a diff on
        # every run, because its pages show live balances and timestamps.
        run: npm run build-storybook -- --quiet

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Serve Storybook
        working-directory: frontend
        run: npx --yes http-server storybook-static -p 6006 --silent &

      - name: Wait for Storybook
        run: npx --yes wait-on http://localhost:6006 --timeout 60000

      - name: Responsive viewport matrix
        working-directory: e2e
        env:
          STORYBOOK_URL: http://localhost:6006
        # Runs BEFORE the visual diff and without PLAYWRIGHT_PINNED_IMAGE,
        # because it asserts geometry rather than pixels and so is not hostage
        # to font rasterisation. Ordering it first means a layout regression is
        # reported as a layout regression, rather than as a wall of screenshot
        # diffs that someone has to interpret.
        #
        # This is the check the `mobile` project was supposed to be. That one
        # needs a running stack -- backend, database, seeded account -- which
        # this job does not have, which is why it sat in playwright.config.js
        # for months without ever executing on a commit.
        run: npm run test:responsive

      - name: Visual regression
        working-directory: e2e
        env:
          PLAYWRIGHT_PINNED_IMAGE: '1'
          STORYBOOK_URL: http://localhost:6006
        run: npm run test:visual

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: e2e/test-results/
          retention-days: 7

  frontend:
    name: Frontend (lint + audit + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint (correctness gate)
        # Zero warnings, and unlike `lint:strict` it means it. The whole-ruleset
        # strict run is unusable as a gate here because 547 of the 709 warnings
        # are design-token drift, which is deliberately ratcheted rather than
        # gated -- each one needs a per-surface design decision. Gating on the
        # combined number forces either bulk-editing them unreviewed or turning
        # the check off, and the second always wins.
        #
        # So the ruleset is split. This config is the base config with the three
        # design-token rules and set-state-in-effect switched off; both of those
        # have ratchets of their own below. Everything left -- react-hooks
        # correctness, unused vars, prefer-const -- is at zero and stays there.
        run: npm run lint:correctness

      - name: set-state-in-effect (ratchet)
        # The one react-hooks rule not in the gate above. Every remaining hit is
        # `useEffect(() => { fetchThing() }, [])` where the fetcher sets a
        # loading flag before its first await: correct external synchronisation
        # that the compiler cannot see past. The derived-state cases the rule
        # actually exists for were fixed rather than counted.
        #
        # Same contract as the drift ratchets: the number may only go down.
        run: npm run effect:drift:ci

      - name: Design token drift (ratchet)
        # A ceiling, not a gate on zero. The cleanup that introduced this left
        # 609 values needing a per-surface design decision -- each moves type or
        # spacing by 1-4px, which is a judgement, not a codemod. Blocking on
        # zero would mean either shipping those changes unreviewed or turning
        # the check off, and the second always wins.
        #
        # So the number may only go down. Lower the --max in package.json with
        # the commit that lowers the count; a change that adds drift fails here
        # rather than being noticed a year later.
        run: npm run design:drift:ci

      - name: Responsive drift (ratchet)
        # Sits at --max 0, unlike its design-token sibling, because every
        # category it counts is a defect with one correct fix rather than a
        # per-surface judgement: a table either has a mobile story or it does
        # not, an edge-pinned bar either clears the notch or it does not.
        #
        # A deliberate exception uses the in-line `responsive-drift-allow:`
        # marker with a stated reason -- the heatmap's irreducible width is the
        # one that exists today -- so the ceiling stays at zero and the
        # exceptions stay visible in the diff that adds them.
        run: npm run responsive:drift:ci

      - name: npm audit (high/critical only)
        # No longer allowed to fail: the vite/esbuild advisories that forced
        # continue-on-error were cleared by the Vite 4 -> 8 upgrade.
        run: npm audit --audit-level=high

      - name: Type check
        # JSDoc + checkJs over the money-adjacent modules (see tsconfig.json for
        # why the include list is narrow and how to widen it). Two ambiguous
        # signatures in finance.js accounted for 36 of the 49 errors the first
        # run reported -- toDecimal's return type genuinely depends on whether
        # the caller opts into a null fallback, which the overloads now say.
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        # Budgets the ENTRY PATH (index + vendor), not total output: a lazy
        # route chunk growing is expected, an entry chunk growing is not, and a
        # whole-output budget lets the second hide behind the first.
        #
        # Limits were seeded from a measured build with roughly 4% headroom, so
        # a real regression trips this rather than ordinary churn. Runs after
        # Build because it reads build/assets.
        run: npm run size

  a11y:
    name: Accessibility (axe-core, real stack)
    runs-on: ubuntu-latest
    # ── Why this job boots the whole platform ──
    #
    # The `visual` job scans components via Storybook, which is genuinely
    # useful and genuinely insufficient: page title, landmark structure,
    # heading order and contrast between two components that are only ever
    # adjacent at run time do not exist until a page is assembled. The trader
    # dashboard, the trading terminal and the admin panel are also the surfaces
    # this platform actually consists of, and all three are behind a login.
    #
    # So this reuses `fresh-deploy`'s recipe -- provision, mint an admin, start
    # the synthetic feed, boot the server, seed -- then adds a frontend and
    # points axe at it.
    #
    # Committed together with e2e/tests/a11y.spec.js, not before it. The
    # `mobile` Playwright project sat in the config for months without ever
    # executing because it needed a running stack that no job provided; a spec
    # whose infrastructure does not exist is a spec that silently never runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: propfirm_ci
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: ci_password_not_a_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://propfirm:ci_password_not_a_secret@localhost:5432/propfirm_ci
      NODE_ENV: development
      PORT: '5000'
      DWX_PATH: /tmp/dwx-bridge
      # Fixed, so Playwright can be handed the same credentials the API creates.
      # launch-smoke.js --provision mints a RANDOM email per run, which is right
      # for a smoke test and useless for handing to a browser.
      E2E_TRADER_EMAIL: a11y-trader@example.com
      E2E_TRADER_PASSWORD: A11yTrader!2026xyz
      E2E_ADMIN_EMAIL_VALUE: a11y-admin@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build the compiled backend
        working-directory: backend
        run: npm run build

      - name: Provision from empty
        working-directory: backend
        run: npm run db:provision

      - name: Create the bootstrap admin
        id: admin
        working-directory: backend
        run: |
          mkdir -p /tmp/dwx-bridge
          OUT=$(node dist/scripts/harden-admin-runtime.js --email "$E2E_ADMIN_EMAIL_VALUE" --no-rotate-env)
          PASS=$(echo "$OUT" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8').match(/\{[\s\S]*\}/)[0]).bootstrap_password")
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: Start the synthetic price feed
        working-directory: backend
        # No MetaTrader in CI, so without this there are no prices and the
        # trading terminal renders an empty shell -- which would scan clean for
        # the wrong reason.
        run: |
          nohup node --enable-source-maps dist/scripts/fake-dwx-feed.js             --file=/tmp/dwx-bridge/DWX_Market_Data.txt --hz=5 --symbols=6             > /tmp/feed.log 2>&1 &
          sleep 3
          test -s /tmp/dwx-bridge/DWX_Market_Data.txt

      - name: Boot the backend
        working-directory: backend
        run: |
          nohup npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/api/health > /dev/null; then
              echo "backend is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend never answered /api/health"
          cat /tmp/server.log
          exit 1

      - name: Seed the platform
        run: |
          curl -sf -X POST http://127.0.0.1:5000/api/setup/init             -H 'Content-Type: application/json' -d '{}' | tee /tmp/setup.json
          grep -q '"success"' /tmp/setup.json

      - name: Register a trader and fund an account
        # Same endpoints scripts/launch-smoke.js uses, with deterministic
        # credentials so Playwright can log in as this trader. An account is
        # required: without one the dashboard renders its empty state and the
        # trading terminal never mounts, so the scan would cover neither.
        run: |
          set -e
          REG=$(curl -sf -X POST http://127.0.0.1:5000/api/auth/register             -H 'Content-Type: application/json'             -d "{\"email\":\"$E2E_TRADER_EMAIL\",\"password\":\"$E2E_TRADER_PASSWORD\",\"full_name\":\"A11y Trader\",\"terms_accepted\":true}")
          USER_ID=$(echo "$REG" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).user.id")
          test -n "$USER_ID" || { echo "::error::registration returned no user id: $REG"; exit 1; }

          ADMIN_TOKEN=$(curl -sf -c /tmp/admin-cookies.txt -X POST http://127.0.0.1:5000/api/admin/login             -H 'Content-Type: application/json'             -d "{\"email\":\"$E2E_ADMIN_EMAIL_VALUE\",\"password\":\"${{ steps.admin.outputs.password }}\"}")
          echo "admin session established"

          curl -sf -b /tmp/admin-cookies.txt -X POST             "http://127.0.0.1:5000/api/admin/users/$USER_ID/manual-account"             -H 'Content-Type: application/json' -d '{"account_size":10000}'             | tee /tmp/account.json
          echo "trader provisioned"

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Serve the production build
        working-directory: frontend
        # `vite preview`, not the dev server: axe must see the built output. Its
        # proxy block (vite.config.mjs) forwards /api and /socket.io to :5000,
        # which keeps the app same-origin -- index.html's CSP has no
        # cross-origin exception, by design.
        run: |
          nohup npx vite preview --port 3000 --strictPort > /tmp/preview.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run axe over public, trader and admin surfaces
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_EMAIL: a11y-trader@example.com
          E2E_PASSWORD: A11yTrader!2026xyz
          E2E_ADMIN_EMAIL: a11y-admin@example.com
          E2E_ADMIN_PASSWORD: ${{ steps.admin.outputs.password }}
        run: npm run test:a11y

      - name: Logs on failure
        if: failure()
        run: |
          echo '── backend ──'; tail -100 /tmp/server.log || true
          echo '── preview ──'; tail -50 /tmp/preview.log || true

      - name: Upload axe report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy-config:
    name: Deploy config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        # Catches the class of bug that made the stack unbootable: build args
        # that no Dockerfile declares, undefined services, bad interpolation.
        run: |
          cp .env.template .env
          docker compose config --quiet
          echo "docker compose config OK"

      - name: Validate nginx config
        # limit_req_zone in the wrong context used to crash-loop nginx and take
        # the whole stack down. `nginx -t` catches it in CI instead of in prod.
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx/propfirm.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.25-alpine \
            sh -c "mkdir -p /etc/nginx/certs \
                   && openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
                        -keyout /etc/nginx/certs/privkey.pem \
                        -out /etc/nginx/certs/fullchain.pem \
                        -subj '/CN=ci.local' 2>/dev/null \
                   && nginx -t"

      - name: Assert frontend build args match the Dockerfile
        run: |
          set -e
          if grep -q 'REACT_APP_' docker-compose.yml frontend/Dockerfile; then
            echo "::error::REACT_APP_* found. This project uses Vite — build args must be VITE_*."
            exit 1
          fi
          for arg in $(grep -oP '^\s+\KVITE_[A-Z_]+(?=:)' docker-compose.yml || true); do
            grep -q "ARG $arg" frontend/Dockerfile || {
              echo "::error::docker-compose passes build arg $arg but frontend/Dockerfile never declares it — Docker would silently drop it."
              exit 1
            }
          done
          echo "build args OK"

      - name: Assert every VITE_* the app reads is actually supplied
        # The REVERSE of the check above, and the direction that was missing.
        #
        # VITE_FX_CONVERSION_ENABLED was read by src/utils/instruments.js to
        # decide which instruments may be opened, and was declared in neither the
        # Dockerfile nor docker-compose. It defaulted to false, which happened to
        # match — so nothing looked wrong. The moment FX_CONVERSION_ENABLED was
        # flipped on the backend, the frontend would have gone on restricting
        # instruments with no way to be told otherwise.
        #
        # Vite inlines these at BUILD time, so an undeclared one cannot be fixed
        # by an environment variable at runtime. It has to be caught here.
        run: |
          set -e
          MISSING=0
          for var in $(grep -rhoE 'import\.meta\.env\.VITE_[A-Z_]+' frontend/src | sed 's/.*env\.//' | sort -u); do
            grep -q "ARG $var" frontend/Dockerfile || {
              echo "::error::frontend/src reads import.meta.env.$var but frontend/Dockerfile declares no 'ARG $var'. Vite inlines these at build time, so it will be undefined in every container build."
              MISSING=1
            }
          done
          exit $MISSING

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: propfirm_ci
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: ci_password_not_a_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://propfirm:ci_password_not_a_secret@localhost:5432/propfirm_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the compiled backend
        run: npm run build

      # ── Audit finding C-02 ──────────────────────────────────────────────────
      # Nothing in the repo ever created users/accounts/trades/payouts — 001
      # creates only platform_settings, and 002 indexes `trades` directly. The
      # schema for every money table existed only inside a hand-built database,
      # so this job could not have been passing on a genuinely empty one.
      #
      # Both files are required. The manifest records WHICH migrations the dump
      # already contains; without it, baselining falls back to stamping every
      # file on disk, which marks any migration added since the dump as applied
      # without running it.
      - name: Check for the committed core schema
        run: |
          MISSING=0
          [ -f migrations/000_core_schema.sql ] || {
            echo "::error title=C-02 unresolved::migrations/000_core_schema.sql is missing, so a clean database cannot be provisioned. Run 'npm run schema:dump' against a known-good database and commit the result."
            MISSING=1
          }
          [ -f migrations/000_core_schema.manifest.json ] || {
            echo "::error title=C-02 unresolved::migrations/000_core_schema.manifest.json is missing. Regenerate with 'npm run schema:dump' and commit it alongside the .sql."
            MISSING=1
          }
          exit $MISSING

      # Provisioning is baseline-then-migrate, not migrate alone.
      #
      # The dump is the schema as it is TODAY. Replaying 001..NNN on top of it
      # re-applies finished steps to a finished schema, and the ones that assumed
      # an intermediate state fail — 005 indexes a column that 008 drops, so it
      # is not in the dump and the index cannot be built. `migrate:latest` on an
      # empty database therefore fails deliberately, with that explanation.
      #
      # ── Why this calls db:provision rather than open-coding the two steps ──
      #
      # It used to run `schema:baseline` then `migrate` as two workflow steps.
      # That proved the MIGRATIONS worked while never testing the command
      # production actually runs — and production ran `npm run migrate` alone,
      # which cannot provision a clean database. docker-compose's migrate service
      # exited non-zero on every fresh volume, and because `backend` waits on it
      # via service_completed_successfully, the entire stack never started.
      # CI was green throughout.
      #
      # So CI now runs the same entrypoint the compose `migrate` service and the
      # Railway startCommand do. If it breaks, this breaks.
      - name: Provision a clean database (the command production runs)
        run: npm run db:provision

      - name: Provisioning is idempotent (deploys re-run it on every boot)
        run: npm run db:provision

      - name: Assert no migrations left pending
        # Guards against a migration file being written but never committed —
        # the failure mode that made a clean clone unbootable.
        run: |
          npx knex --knexfile dist/knexfile.js migrate:status
          PENDING=$(npx knex --knexfile dist/knexfile.js migrate:list 2>/dev/null | grep -ci 'pending' || true)
          if [ "$PENDING" != "0" ]; then
            echo "::error::Migrations still pending after migrate:latest"
            exit 1
          fi

      - name: Verify core tables exist and money columns are exact
        # migrate:latest exiting 0 does not prove the money tables were created,
        # nor that their columns are NUMERIC rather than binary floats — a
        # double-precision balance silently discards the precision the whole
        # application layer is built on.
        run: npm run schema:verify

      - name: Verify every column the SQL writes actually exists
        # `payouts.updated_at` was written by four code paths and created by no
        # migration, so every admin payout approve/reject/flag/unflag returned
        # 500 against a correct database. The payout tests mock the pg pool, so
        # no SQL on that path had ever executed. This job has the one thing that
        # can tell the difference: a schema built by the real migrations.
        run: npm run check:sql-columns

      - name: Type-check every static query against Postgres
        # Stronger than the column check, which cannot see ambiguous references
        # or type mismatches. PREPARE makes Postgres parse, resolve and plan each
        # statement without running it -- it caught GET /api/auth/profile/:userId
        # (ambiguous `id` across a join, 500 on every request since it shipped)
        # and the Stripe challenge checkout (text = bigint, 500 for every caller).
        run: npm run check:sql-prepare

  fresh-deploy:
    name: Fresh deploy boots and trades
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ── Why this job exists ──
    #
    # Every other job here passes against a broken deployment. Unit tests mock
    # the database; the migrations job tests the schema; lint cannot see inside a
    # SQL string. None of them start the application.
    #
    # Two defects that shipped anyway, both caught only by doing this:
    #   1. `npm run migrate` on an empty database fails by design, so the compose
    #      migrate service never completed and the whole stack never started.
    #   2. trades.account_id is uuid and trade_logs.account_id is text; one query
    #      compared both to the same $1, so Postgres resolved it as uuid and
    #      EVERY trade open returned 500. Reproducible only against a real
    #      Postgres with both tables present.
    #
    # So: provision from empty, boot the real server, and trade on it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: propfirm_ci
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: ci_password_not_a_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://propfirm:ci_password_not_a_secret@localhost:5432/propfirm_ci
      NODE_ENV: development
      PORT: '5000'
      DWX_PATH: /tmp/dwx-bridge
      SMOKE_BASE_URL: http://127.0.0.1:5000
      # Short, because CI does not need to prove the 60s hold rule a second time
      # — the smoke test waits it out, and the rule has its own unit coverage.
      SMOKE_MAX_HOLD_WAIT_SECONDS: '75'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the compiled backend
        run: npm run build

      - name: Provision from empty
        run: npm run db:provision

      - name: Create the bootstrap admin
        id: admin
        # --no-rotate-env: rotating secrets into a CI checkout's .env is
        # pointless and would make the printed summary claim something untrue.
        run: |
          mkdir -p /tmp/dwx-bridge
          OUT=$(node dist/scripts/harden-admin-runtime.js --email ci-admin@example.com --no-rotate-env)
          echo "$OUT"
          PASS=$(echo "$OUT" | sed -nE 's/.*"bootstrap_password": "([^"]*)".*/\1/p' | head -1)
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: Start the synthetic price feed
        # The feed is file-based and there is no MetaTrader in CI, so without
        # this there are no prices and no trade can be opened at all.
        run: |
          nohup node --enable-source-maps dist/scripts/fake-dwx-feed.js \
            --file=/tmp/dwx-bridge/DWX_Market_Data.txt --hz=5 --symbols=6 \
            > /tmp/feed.log 2>&1 &
          sleep 3
          test -s /tmp/dwx-bridge/DWX_Market_Data.txt

      - name: Boot the server
        run: |
          nohup npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/api/health > /dev/null; then
              echo "backend is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend never answered /api/health"
          cat /tmp/server.log
          exit 1

      - name: Seed the platform (first-run endpoint)
        run: |
          curl -sf -X POST http://127.0.0.1:5000/api/setup/init \
            -H 'Content-Type: application/json' -d '{}' | tee /tmp/setup.json
          grep -q '"success"' /tmp/setup.json

      - name: Smoke the money path
        env:
          SMOKE_SUPER_ADMIN_EMAIL: ci-admin@example.com
          SMOKE_SUPER_ADMIN_PASSWORD: ${{ steps.admin.outputs.password }}
        run: npm run launch:smoke -- --provision

      - name: Engine equivalence (event is the default — this is its gate)
        run: npm run engine:equivalence -- --ticks=60

      - name: Build and smoke the final production image
        run: |
          docker build -f backend/Dockerfile -t propfirm-backend-ci ..
          docker run --rm --network host \
            -e DATABASE_URL -e NODE_ENV=development \
            --entrypoint dumb-init propfirm-backend-ci \
            -- npm run db:provision
          docker run -d --name propfirm-backend-ci-smoke --network host \
            -e DATABASE_URL -e NODE_ENV=development -e ROLE=api -e PORT=5001 \
            -e DWX_PATH=/tmp/dwx-bridge \
            -v /tmp/dwx-bridge:/tmp/dwx-bridge \
            propfirm-backend-ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5001/api/health > /dev/null; then
              echo "production image is up after ${i}s"; break
            fi
            if [ "$i" = 60 ]; then
              docker logs propfirm-backend-ci-smoke
              exit 1
            fi
            sleep 1
          done
          docker stop --time 15 propfirm-backend-ci-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' propfirm-backend-ci-smoke)" = 0
          test -z "$(docker inspect --format '{{.State.Error}}' propfirm-backend-ci-smoke)"
          docker rm propfirm-backend-ci-smoke

      - name: Production image logs on failure
        if: failure()
        run: docker logs propfirm-backend-ci-smoke 2>/dev/null || true

      - name: Remove production smoke container
        if: always()
        run: docker rm -f propfirm-backend-ci-smoke 2>/dev/null || true

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/server.log || true
