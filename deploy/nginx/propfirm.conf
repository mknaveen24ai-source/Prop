map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limit zones ─────────────────────────────────────────────────────────
# These MUST live at http context. conf.d/*.conf is included inside the http
# block, so top-of-file is correct. Declaring them inside server {} makes nginx
# abort with: "limit_req_zone" directive is not allowed here.
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Force HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    # Catch-all vhost for platform wildcard subdomains and manually onboarded
    # custom domains that point their CNAME/A record at this proxy.
    server_name _;

    # ── SSL ─────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ─────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    # frame-ancestors is the modern replacement for X-Frame-Options and is only
    # honoured as a header — a <meta http-equiv> policy (frontend/index.html)
    # has it ignored — so it is set here, where the SPA's HTML is served.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Rate limiting ────────────────────────────────────────────────────────────
    # Zones are declared at http context, at the top of this file. Only the
    # per-location `limit_req` directives below belong inside server {}.

    client_max_body_size 10M;

    # ── API Proxy → Express Backend ──────────────────────────────────────────────
    location /api/ {
        # 30r/s per ADDRESS, not per user. Traders behind one corporate NAT or a
        # mobile carrier's CGNAT share an address and therefore share this
        # budget — worth revisiting before a launch that expects concentrated
        # traffic from one network.
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Auth endpoints — stricter rate limit ──────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.IO) ────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Prices are pushed, not requested. Buffering delays every frame by up to
        # a buffer's worth for no benefit, and holds them in nginx's memory —
        # which is multiplied by the connection count.
        proxy_buffering off;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml;
    gzip_min_length 1024;
}
