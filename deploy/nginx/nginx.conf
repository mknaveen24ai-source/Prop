# ─────────────────────────────────────────────────────────────────────────────
# Main nginx configuration
# ─────────────────────────────────────────────────────────────────────────────
# The vhost lives in conf.d/default.conf (deploy/nginx/propfirm.conf). This file
# exists for the handful of settings that CANNOT be set from conf.d, because
# conf.d is included inside `http {}` and these belong to `main` and `events`.
#
# ── The setting that matters: worker_connections ──
#
# The stock image ships `worker_connections 1024`. Every proxied WebSocket costs
# TWO of them — one to the browser, one to the upstream — so the default caps a
# 4-worker nginx at roughly 2,000 concurrent traders no matter how much hardware
# is behind it. When it is reached, nginx does not degrade: it stops accepting
# and logs "worker_connections are not enough". That is the first wall a socket
# load test hits, and it is invisible from the application side.
#
# 65536 x worker_processes is deliberately far above the target. Connection slots
# are a few hundred bytes each; the memory is irrelevant next to being unable to
# accept a connection.
#
# Mounted by docker-compose.yml at /etc/nginx/nginx.conf.

user  nginx;
worker_processes  auto;

# Each connection needs a file descriptor, so raising worker_connections without
# raising the fd limit just moves the failure to "Too many open files". Must be
# at least worker_connections; the container also needs a matching ulimit, which
# docker-compose.yml sets on the nginx service.
worker_rlimit_nofile 131072;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  65536;
    # Let every worker accept as many pending connections as it can per wake-up.
    # Off by default, which serialises accepts and shows up as slow connect times
    # exactly when many clients reconnect at once — a deploy, or a gateway
    # dropping out and its traders landing on the survivors.
    multi_accept  on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Long enough to be worth reusing, short enough that a rolling deploy drains.
    keepalive_timeout   65;
    keepalive_requests  1000;

    # Header buffers: the default 4k is enough for a browser but not for the
    # cookie sizes an admin session can reach alongside a long URL.
    client_header_buffer_size    4k;
    large_client_header_buffers  4 16k;

    server_tokens off;

    # The vhost, rate-limit zones and upstreams.
    include /etc/nginx/conf.d/*.conf;
}
