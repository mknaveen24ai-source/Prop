# ─────────────────────────────────────────────────────────────────────────────
# PropFirm vhost — SCALE-OUT topology
# ─────────────────────────────────────────────────────────────────────────────
# Use this INSTEAD OF propfirm.conf when running split roles (ROLE=engine /
# gateway / api). It is a separate file rather than a flag inside propfirm.conf
# because nginx resolves upstream hostnames at startup and refuses to start if
# one is missing: a single config referencing `gateway1` would break every
# single-node deployment on the next `git pull`.
#
#   Single node (default):  mount propfirm.conf          → /etc/nginx/conf.d/default.conf
#   Split roles:            mount propfirm.scaleout.conf → /etc/nginx/conf.d/default.conf
#
# ── What changes, and why ──
#
# 1. Sockets and API traffic go to DIFFERENT upstreams. They scale on different
#    things — sockets on connection count, the API on request rate — and mixing
#    them means a burst of one evicts the other.
#
# 2. Socket traffic is STICKY. Socket.IO's polling fallback (enabled in the
#    client) sends a handshake, gets back a session id, and every subsequent
#    poll MUST reach the process holding that session. Round-robin produces
#    "Session ID unknown" and an infinite reconnect loop for exactly the clients
#    that could not use WebSocket in the first place — corporate proxies, some
#    mobile networks — so it fails for a minority and looks fine in testing.
#
# 3. The ENGINE is not in any upstream. It is not a web server; it holds the
#    trade index and runs the tick that decides whether a stop-loss fires.
#    Sending it HTTP traffic steals event-loop time from that. It answers
#    /api/health on its own port for monitoring, and nothing else routes to it.
#
# Compose resolves a scaled service name to all of its replicas when nginx
# starts. For multi-host deployments, replace these service names with the
# actual stable gateway/API addresses and reload nginx after membership changes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── Socket gateways (ROLE=gateway) ───────────────────────────────────────────
# `hash ... consistent` is the stickiness available in nginx OSS — `sticky` is a
# Plus-only directive.
#
# The key is "$arg_sid$remote_addr":
#   - $arg_sid is the Socket.IO session id, present on every request after the
#     handshake. While it is there, all of that session's polls hash to one
#     gateway, which is the actual requirement.
#   - On the first handshake there is no sid yet, so it falls back to the client
#     address, which is stable for the moments that matter.
#
# `consistent` (ketama) means adding or removing a gateway remaps only its share
# of sessions instead of reshuffling everyone — the difference between one
# gateway's traders reconnecting and all of them reconnecting at once.
upstream socket_gateways {
    hash $arg_sid$remote_addr consistent;

    server gateway:5000 max_fails=3 fail_timeout=10s;

    # Idle upstream connections kept per worker. Without this every poll in the
    # polling fallback opens a new TCP connection to the gateway.
    keepalive 512;
}

# ── API nodes (ROLE=api) ─────────────────────────────────────────────────────
# Stateless, so least_conn is the right choice: it sends the next request to
# whichever node is least busy rather than blindly alternating.
upstream api_nodes {
    least_conn;

    server api:5000 max_fails=3 fail_timeout=10s;

    keepalive 128;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # See propfirm.conf — `listen ... http2` is deprecated in nginx 1.24+.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # Larger than the single-node config: at 10K traders a cold handshake for
    # every reconnect is real CPU, and the cache is the cheapest way to avoid it.
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10M;

    # ── WebSocket (Socket.IO) ────────────────────────────────────────────────
    # Deliberately FIRST: it must win over /api/ and / regardless of ordering
    # rules, and having it at the top makes that obvious to the next reader.
    #
    # No limit_req here. The rate zone counts requests per address, and in
    # polling mode a single healthy trader issues a steady stream of them —
    # rate-limiting the transport would disconnect the users who need the
    # fallback most.
    location /socket.io/ {
        proxy_pass         http://socket_gateways;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # An idle WebSocket carries no bytes for minutes at a time and must not
        # be mistaken for a dead one.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Prices are pushed, not requested. Buffering delays every frame by up to
        # a buffer's worth for no benefit, and holds them in nginx's memory —
        # multiplied by 10,000 connections.
        proxy_buffering off;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://api_nodes;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 30r/s per ADDRESS. Worth reviewing before a launch: traders behind one
        # corporate NAT or a mobile carrier's CGNAT share an address, so this is
        # a shared budget for that whole group, not a per-person one.
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://api_nodes;
        proxy_http_version 1.1;
        # Required for upstream keepalive: without it nginx sends
        # `Connection: close` and the keepalive pool above is never used.
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml;
    gzip_min_length 1024;
}
